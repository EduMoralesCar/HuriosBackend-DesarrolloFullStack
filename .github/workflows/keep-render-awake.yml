name: Mantiene despierto el backend de Render

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Hace ping al backend publico
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            https://huriosrally-backend.onrender.com/health-public
